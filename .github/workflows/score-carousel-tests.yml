name: Score Carousel Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: score-carousel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  score-carousel:
    name: Score carousel regression suite
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.2
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Prepare simulator accessibility for hosted view tests
        run: |
          simulator_id=$(xcrun simctl create "Hackers CI" com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro com.apple.CoreSimulator.SimRuntime.iOS-26-2)
          xcrun simctl boot "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
          xcrun simctl spawn "$simulator_id" defaults write com.apple.Accessibility AccessibilityEnabled -bool YES
          xcrun simctl spawn "$simulator_id" defaults write com.apple.Accessibility ApplicationAccessibilityEnabled -bool YES
          echo "HACKERS_TEST_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"

      - name: Run score carousel tests
        run: >-
          xcodebuild test
          -project Hackers.xcodeproj
          -scheme Sandbox
          -configuration Sandbox
          -destination "platform=iOS Simulator,id=${HACKERS_TEST_SIMULATOR_ID}"
          -parallel-testing-enabled NO
          -collect-test-diagnostics never
          -only-testing:HackersUnitTests/ScoreCarouselSelectionTests
          -only-testing:HackersUnitTests/RoundSessionLifecycleTests
          -only-testing:HackersUnitTests/RoundSessionReloadTests
          -only-testing:HackersUnitTests/LiveRoundResumeRegressionTests
          -only-testing:HackersUnitTests/AppSessionResumeTests
          -only-testing:HackersUnitTests/FirebaseIDValidationTests
          -only-testing:HackersUnitTests/RoundSessionReadinessTests
          -only-testing:HackersUnitTests/UserCompanionPreferencesTests
          -only-testing:HackersUnitTests/LiveRoundCompanionContractTests
          -only-testing:HackersUnitTests/InternalReleaseBlockerAuditTests
          -only-testing:HackersUnitTests/ScoringRobustnessTests
          -only-testing:HackersUnitTests/GolfCourseRepositoryTests
          -only-testing:HackersUnitTests/RoundHandicapEntryTests
          -only-testing:HackersUnitTests/RoundHandicapRegressionTests
          -only-testing:HackersUnitTests/CourseHandicapCalculationRegressionTests
          -only-testing:HackersUnitTests/HandicapNormalizationRegressionTests
          -only-testing:HackersUnitTests/HandicapKeyboardDismissalTests
          -only-testing:HackersUnitTests/SeriesRoundStartAuditTests
          -only-testing:HackersUnitTests/SeriesRoundCreationMappingTests
          -only-testing:HackersUnitTests/SeriesRoundSyncServiceTests
          -only-testing:HackersUnitTests/SeriesRoundCodableTests
          -only-testing:HackersUnitTests/SeriesHandicapIndexLimitTests
          -only-testing:HackersUnitTests/RoundParticipantHandicapOverrideTests
          -only-testing:HackersUnitTests/ScoringEngineTests
          CODE_SIGNING_ALLOWED=NO
